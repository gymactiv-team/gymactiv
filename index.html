<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GymActiv</title>
<link rel="canonical" href="https://www.gymactiv.be/">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://www.gymactiv.be/">
<link rel="icon" href="https://www.gymactiv.be/logo_GymActiv.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Sora',system-ui,-apple-system,sans-serif;
    background:#F7F4EC;color:#16210F;
    min-height:100vh;display:grid;place-items:center;
    padding:28px;text-align:center;line-height:1.6;
  }
  .merk{display:flex;align-items:center;justify-content:center;gap:7px;font-weight:800;font-size:22px;letter-spacing:-.5px;margin-bottom:18px}
  .merk-vlak{width:32px;height:32px;border-radius:50%;background:#2A4825;display:grid;place-items:center;flex:0 0 32px}
  .merk-vlak svg{width:16px;height:16px;display:block}
  .merk span{color:#4A6741}
  p{color:#6E6B62;font-size:15px;max-width:34ch;margin:0 auto 24px}
  a{
    display:inline-block;background:#16210F;color:#F7F4EC;
    text-decoration:none;font-weight:700;font-size:14px;
    padding:13px 26px;border-radius:13px;
  }
  a:focus-visible{outline:2px solid #4A6741;outline-offset:3px}
</style>
</head>
<body>
  <main>
    <div class="merk">
      <div class="merk-vlak" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M13.5 2 4 13.2h6.2L9.8 22 20 10.6h-6.6L13.5 2Z" fill="#7FBF3F"/></svg>
      </div>Gym<span>Activ</span>
    </div>
    <p>Je wordt doorgestuurd naar gymactiv.be.</p>
    <a href="https://www.gymactiv.be/">Ga verder</a>
  </main>
</body>
</html>
